[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "sheikh-hamamomin-ai"
version = "0.1.0"
description = "Permission-controlled Kurdish Windows desktop assistant"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7", "httpx>=0.27,<1", "psutil>=6,<8", "keyring>=25,<26", "python-dotenv>=1,<2"]
[project.optional-dependencies]
voice = ["numpy>=1.26", "sounddevice>=0.5", "soundfile>=0.13", "faster-whisper>=1.1", "pyttsx3>=2.98"]
automation = ["pyautogui>=0.9.54", "playwright>=1.49"]
service = ["fastapi>=0.115", "uvicorn>=0.34"]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6", "pillow>=11"]
[project.scripts]
hamamomin = "hamamomin.__main__:main"
[tool.setuptools.packages.find]
include = ["hamamomin*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
